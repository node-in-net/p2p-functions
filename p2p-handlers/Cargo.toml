[package]
name = "p2p-handlers"
version = "0.1.286"
edition = "2021"
description = "Capabilities a node serves to its peers: filesystem, terminal, registry, remote desktop, SOCKS and web proxy, folder sync, system info"
license = "MIT OR Apache-2.0"
repository = "https://github.com/node-in-net/p2p-functions"
publish = false

[dependencies]
p2p-node = { git = "https://github.com/node-in-net/p2p-common", branch = "main", default-features = false }
client-core = { git = "https://github.com/node-in-net/p2p-common", branch = "main", default-features = false }
nodeinnet-p2p = { git = "https://github.com/node-in-net/p2p-common", branch = "main" }
node-functions = { path = "../node-functions", default-features = false }
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }

[features]
default = [
    "feature-fm",
    "feature-sync",
    "feature-net",
    "feature-terminal",
    "feature-sysinfo",
    "feature-registry",
    "feature-rdesk",
]

feature-fm = ["node-functions/fs"]
feature-sync = ["node-functions/sync"]
feature-net = ["node-functions/net"]
feature-terminal = ["node-functions/terminal"]
feature-sysinfo = ["node-functions/sysinfo"]
feature-registry = ["node-functions/registry"]
feature-rdesk = ["client-core/feature-rdesk", "node-functions/screen-capture"]
