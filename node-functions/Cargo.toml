[package]
name = "node-functions"
version = "0.1.286"
edition = "2021"
description = "Platform implementations behind the node.in.net capabilities: local filesystem, PTY terminal, Windows registry, desktop capture and input injection, SOCKS and HTTP proxying, folder sync, system info"
license = "MIT OR Apache-2.0"
repository = "https://github.com/node-in-net/p2p-functions"
publish = false

[dependencies]
tokio = { workspace = true, features = ["full"] }
sysinfo = "0.29"
network-interface = "1.1.1"
nodeinnet-p2p = { workspace = true }
client-config = { workspace = true }
portable-pty = "0.9.0"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
walkdir = "2.5.0"
md5 = "0.8.0"
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = { version = "2.0", optional = true }
winreg = "0.52"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.9", optional = true }
gstreamer = { package = "gstreamer", version = "0.22", optional = true }
gstreamer-app = { package = "gstreamer-app", version = "0.22", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "1.5.4", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
screenshots = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["full"] }

[features]
default = ["screen-capture"]
screen-capture = ["dep:ashpd", "dep:gstreamer", "dep:gstreamer-app", "dep:windows-capture", "dep:screencapturekit"]
# Test-only: animated frames instead of a real screen, so the rdesk media path
# runs headlessly. Not in `default`; apps never enable it.
synthetic-capture = []

