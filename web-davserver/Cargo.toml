[package]
name = "web-davserver"
version = "0.1.286"
edition = "2021"
description = "WebDAV bridge: serves a remote peer resource as a local WebDAV mount, translating requests into p2p protocol messages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/node-in-net/p2p-functions"
publish = false

[dependencies]
actix-web = { workspace = true }
actix-web-httpauth = { workspace = true }
nodeinnet-p2p = { workspace = true }
dav-server = { version = "0.5", default-features = false }
bytes = { workspace = true }
futures-util = "0.3"
http = "0.2"
uuid = { version = "1.0", features = ["v4"] }
tokio = { workspace = true }
md-5 = "0.10"
