[package]
name = "web-davserver"
version = "0.1.286"
edition = "2021"
description = "WebDAV bridge: serves a remote peer resource as a local WebDAV mount, translating requests into p2p protocol messages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/node-in-net/p2p-functions"
publish = false

[dependencies]
actix-web = "4.5.1"
actix-web-httpauth = "0.8.1"
nodeinnet-p2p = { git = "https://github.com/node-in-net/p2p-common", branch = "main" }
dav-server = { version = "0.5", default-features = false }
bytes = { version = "1.6.0", features = ["serde"] }
futures-util = "0.3"
http = "0.2"
uuid = { version = "1.0", features = ["v4"] }
tokio = { version = "1.36", features = ["full"] }
md-5 = "0.10"

[dev-dependencies]
tokio = { version = "1.36", features = ["full", "test-util"] }
